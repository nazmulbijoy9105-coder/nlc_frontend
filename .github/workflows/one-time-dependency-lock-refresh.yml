name: One-time dependency lock refresh

on:
  push:
    branches:
      - fix/nlc-frontend-production-hardening-20261127

permissions:
  contents: write
  actions: write

concurrency:
  group: nlc-frontend-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve semver-compatible security fixes into the lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install exactly from the refreshed lockfile
        run: npm ci
      - name: Require a clean dependency audit
        run: npm audit --audit-level=low
      - name: Run frontend contract tests
        run: npm run test:contracts
      - name: Run lint
        run: npm run lint
      - name: Run TypeScript checks
        run: npx tsc --noEmit
      - name: Run production build
        run: npm run build
      - name: Commit the verified lockfile and dispatch canonical CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): refresh vulnerable npm lockfile resolutions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "No lockfile changes were required."
          fi
